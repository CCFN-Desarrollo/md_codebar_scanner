name: Release

# Un tag vX.Y.Z sobre master compila, firma y publica el APK en el servidor de
# auto-update (sap10). Ver docs/CD.md.
#
#   git checkout master && git pull
#   git tag v2.0.2 && git push origin v2.0.2
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # crear el GitHub Release

env:
  FLUTTER_VERSION: 3.47.5
  SERVIDOR: ec2-user@13.52.132.84
  # Huella publica del servidor: evita publicar en un equipo suplantado.
  SERVIDOR_HOST_KEY: "13.52.132.84 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG92nlUmJD3dKhLFA1PJaW1VhNxIwwNHUuiIjDWacxbT"
  # Certificado con el que estan firmados los APK ya instalados. Si cambia,
  # Android rechaza la actualizacion y hay que desinstalar en cada equipo.
  CERT_SHA256: 4de6728335ea54e7891f8fb156a21d27bc8b0f4ec0b77e0732ff3fbac939c290
  URL_VERSION: http://crm.ccfnweb.com.mx/sap10/MD_CODEBAR_SCANNER_VERSION.text

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # En Settings > Environments > production se puede exigir aprobacion manual.
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # La version sale del tag (v2.0.3 -> 2.0.3); pubspec.yaml no se toca.
      # El numero de build (versionCode de Android) es 100 + numero de ejecucion
      # de este workflow: siempre crece y supera al de las versiones manuales (+3).
      - name: Validar tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::El tag $GITHUB_REF_NAME debe tener formato vX.Y.Z"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::El tag debe apuntar a un commit que ya este en master"
            exit 1
          fi
          # La app solo instala versiones mayores a la que tiene: no publicar una igual o menor.
          PUBLICADA=$(curl -fsS -H 'Cache-Control: no-cache' "$URL_VERSION?ci=$GITHUB_RUN_ID" | tr -d ' \r\n\t' || true)
          if [ -n "$PUBLICADA" ]; then
            MAYOR=$(printf '%s\n%s\n' "$PUBLICADA" "$VERSION" | sort -V | tail -1)
            if [ "$VERSION" = "$PUBLICADA" ] || [ "$MAYOR" != "$VERSION" ]; then
              echo "::error::El servidor ya tiene $PUBLICADA; el tag debe ser mayor"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Publicando $VERSION (build $((100 + GITHUB_RUN_NUMBER))); servidor en ${PUBLICADA:-?}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      # android/app/build.gradle.kts firma con ANDROID_KEYSTORE_PATH si existe.
      # Antes de compilar se comprueba que el keystore del secret sea el de los
      # equipos instalados (si no, el error dice que hay que cambiar el secret).
      - name: Llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.SCANNER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Falta el secret SCANNER_KEYSTORE_B64"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          KS="$RUNNER_TEMP/keys/release.keystore"
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$KS"
          SALIDA=$(keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey 2>&1) || {
            echo "$SALIDA"
            echo "::error::El secret SCANNER_KEYSTORE_B64 no es un keystore valido (o no tiene el alias androiddebugkey / clave android)"
            exit 1
          }
          HUELLA=$(printf '%s\n' "$SALIDA" | grep -oE 'SHA256: [0-9A-Fa-f:]+' | head -1 | cut -d' ' -f2 | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$HUELLA" != "$CERT_SHA256" ]; then
            echo "::error::El keystore del secret SCANNER_KEYSTORE_B64 tiene la huella ${HUELLA:-desconocida}; se esperaba $CERT_SHA256. Cargar el debug.keystore correcto."
            exit 1
          fi
          echo "Keystore correcto: $HUELLA"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - run: flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - uses: actions/upload-artifact@v5
        with:
          name: md_codebar_scanner-${{ env.VERSION }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Verificar firma
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          echo "apksigner de $BT"
          SALIDA=$("${BT}apksigner" verify --print-certs "$APK" 2>&1)
          echo "$SALIDA"
          # El formato de la linea cambia entre versiones de apksigner
          # ("Signer #1 certificate..." / "Signer (minSdkVersion=...) certificate..."):
          # se toman todas las huellas SHA-256 y deben ser todas la esperada.
          HUELLAS=$(printf '%s\n' "$SALIDA" | grep -i 'certificate SHA-256 digest' \
            | grep -oiE '[0-9a-f]{64}' | tr 'A-F' 'a-f' | sort -u)
          if [ "$HUELLAS" != "$CERT_SHA256" ]; then
            echo "::error::Firma inesperada. Esperada $CERT_SHA256, encontrada: ${HUELLAS:-ninguna}"
            exit 1
          fi
          echo "Firma correcta: $HUELLAS"

      # La llave solo puede ejecutar ~/bin/md-scanner-recibir (apk | version).
      # El APK se sube antes que la version para que ningun equipo descargue el anterior.
      - name: Publicar en sap10
        env:
          DEPLOY_KEY: ${{ secrets.SCANNER_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SERVIDOR_HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          SSH="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o ConnectTimeout=20"
          $SSH "$SERVIDOR" apk < build/app/outputs/flutter-apk/app-release.apk
          printf '%s' "$VERSION" | $SSH "$SERVIDOR" version

      - name: Comprobar version publicada
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            PUBLICADA=$(curl -fsS -H 'Cache-Control: no-cache' "$URL_VERSION?ci=$GITHUB_RUN_ID" || true)
            if [ "$PUBLICADA" = "$VERSION" ]; then
              echo "Servidor en $PUBLICADA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::El servidor responde '$PUBLICADA', se esperaba $VERSION"
          exit 1

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Notas generadas por GitHub con los PRs mergeados desde el tag anterior.
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/md_codebar_scanner-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/md_codebar_scanner-$VERSION.apk" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Borrar llaves
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/keys"
